name: Автообновление расписания автобусов

on:
  schedule:
    # Ночной слот: 00:17 по Минску (21:17 UTC) — успевает обновиться к утру даже при очередях GitHub
    - cron: '17 21 * * *'
    # Контрольный утренний слот: 06:23 по Минску (03:23 UTC) — проверит изменения без лишнего коммита
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обновить расписание 150 и 170с
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 update_schedule.py --smart
          else
            python3 update_schedule.py
          fi

      - name: Зафиксировать изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule_data.js schedule_data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: обновление расписания автобусов"
            git pull --rebase origin main
            git push
          fi
